<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>编辑图片</title>
<style>
:root {
  --c-bg: #F7F8FA;
  --c-surface: #FCFCFD;
  --c-surface-hover: #F2F4F8;
  --c-border: #ECEEF2;
  --c-gray-400: #D1D5DB;
  --c-gray-500: #9CA3AF;
  --c-gray-600: #6B7280;
  --c-gray-900: #202124;
  --c-primary: #6C63FF;
  --c-primary-hover: #5B52E0;
  --c-primary-bg: rgba(108,99,255,.08);
  --c-danger: #EF4444;
  --c-red-bg: rgba(239,68,68,.08);
  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 12px;
  --ease: cubic-bezier(.25,.46,.45,.94);
  --dur: 200ms;
}

* { margin:0; padding:0; box-sizing:border-box; border:none; outline:none; }
body {
  font-family: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background: var(--c-bg);
  color: var(--c-gray-900);
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 12px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  flex-shrink: 0;
  height: 44px;
  -webkit-app-region: drag;
}
.tool-btn {
  -webkit-app-region: no-drag;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border: none;
  background: none;
  color: var(--c-gray-500);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.tool-btn:hover { background: var(--c-surface-hover); color: var(--c-gray-900); }
.tool-btn.active { background: var(--c-primary); color: #fff; box-shadow: 0 2px 8px rgba(108,99,255,.25); }
.tool-btn svg { width: 18px; height: 18px; }
.tool-btn::after {
  content: attr(data-tip);
  position: absolute;
  bottom: -30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--c-gray-900);
  color: #fff;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.1s;
  z-index: 100;
}
.tool-btn:hover::after { opacity: 1; }
.tool-sep { width: 1px; height: 22px; background: var(--c-border); margin: 0 6px; }
.toolbar-right { margin-left: auto; display: flex; gap: 6px; align-items: center; -webkit-app-region: no-drag; }
.btn {
  padding: 6px 16px;
  border: none;
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  transition: all var(--dur) var(--ease);
}
.btn-cancel { background: var(--c-surface-hover); color: var(--c-gray-600); }
.btn-cancel:hover { background: var(--c-border); color: var(--c-gray-900); }
.btn-copy { background: var(--c-surface-hover); color: var(--c-gray-700); }
.btn-copy:hover { background: var(--c-border); }
.btn-save { background: var(--c-primary); color: #fff; box-shadow: 0 2px 8px rgba(108,99,255,.25); }
.btn-save:hover { background: var(--c-primary-hover); }

/* Canvas */
.canvas-wrap {
  flex: 1;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--c-bg);
  background-image: linear-gradient(45deg, var(--c-surface-hover) 25%, transparent 25%), linear-gradient(-45deg, var(--c-surface-hover) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--c-surface-hover) 75%), linear-gradient(-45deg, transparent 75%, var(--c-surface-hover) 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
}
canvas { display: block; box-shadow: 0 4px 16px rgba(0,0,0,.1); cursor: crosshair; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }

/* Bottom bar */
.bottom-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  background: var(--c-surface);
  border-top: 1px solid var(--c-border);
  height: 32px; flex-shrink: 0;
  font-size: 11px; color: var(--c-gray-500);
}
.bottom-bar .hint { display: flex; gap: 12px; }
.bottom-bar kbd {
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 10px;
  font-family: monospace;
  color: var(--c-gray-600);
}

/* Colors */
.color-picker { -webkit-app-region: no-drag; display: flex; gap: 4px; align-items: center; }
.color-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.color-dot:hover { transform: scale(1.2); }
.color-dot.active { border-color: var(--c-primary); box-shadow: 0 0 0 2px var(--c-primary-bg); }

/* Width */
.width-picker { -webkit-app-region: no-drag; display: flex; gap: 3px; align-items: center; margin-left: 4px; }
.width-dot { border-radius: 50%; background: var(--c-gray-400); cursor: pointer; transition: all var(--dur) var(--ease); }
.width-dot:hover { background: var(--c-gray-600); }
.width-dot.active { background: var(--c-primary); }

/* Font size */
.font-size-picker { -webkit-app-region: no-drag; display: none; align-items: center; gap: 4px; margin-left: 6px; font-size: 11px; color: var(--c-gray-500); }
.font-size-picker.show { display: flex; }
.font-size-picker input {
  width: 48px; background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: var(--r-sm); color: var(--c-gray-900);
  font-size: 11px; padding: 2px 4px; text-align: center; outline: none;
}
.font-size-picker input:focus { border-color: var(--c-primary); }

/* Text input */
.text-input { position: fixed; display: none; z-index: 10; }
.text-input textarea {
  background: var(--c-surface); border: 2px solid var(--c-primary);
  color: var(--c-gray-900); font-size: 16px;
  padding: 6px 8px; border-radius: var(--r-sm);
  outline: none; resize: both;
  min-width: 120px; min-height: 32px; font-family: inherit;
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
}

/* Result Panel */
.text-panel {
  display: none; position: fixed; right: 16px; top: 16px; bottom: 16px;
  width: 400px; max-width: calc(100vw - 32px);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  z-index: 20; flex-direction: column;
  box-shadow: 0 8px 32px rgba(0,0,0,.12);
  animation: panelIn .2s var(--ease);
}
@keyframes panelIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
.text-panel.show { display: flex; }
.text-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--c-border); flex-shrink: 0;
}
.text-panel-title { font-size: 15px; font-weight: 600; color: var(--c-gray-900); }
.text-panel-close {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border: none;
  background: var(--c-surface-hover); color: var(--c-gray-600);
  cursor: pointer; border-radius: var(--r-sm);
  font-size: 18px; transition: all var(--dur) var(--ease);
}
.text-panel-close:hover { color: var(--c-gray-900); background: var(--c-border); }
.text-panel-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.text-panel-body::-webkit-scrollbar { width: 4px; }
.text-panel-body::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }

.result-label { font-size: 11px; color: var(--c-gray-500); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.result-text {
  width: 100%;
  background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: var(--r-sm); color: var(--c-gray-900);
  font-size: 14px; line-height: 1.7; padding: 12px;
  font-family: inherit; outline: none;
  white-space: pre-wrap; word-break: break-all;
  min-height: 60px;
  user-select: text; -webkit-user-select: text;
}
.result-actions { display: flex; gap: 8px; }
.result-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 12px; border: none; border-radius: var(--r-sm);
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all var(--dur) var(--ease);
}
.result-btn svg { width: 14px; height: 14px; }
.result-btn.copy { background: var(--c-surface-hover); color: var(--c-gray-700); }
.result-btn.copy:hover { background: var(--c-border); }
.result-btn.translate { background: var(--c-primary-bg); color: var(--c-primary); }
.result-btn.translate:hover { background: var(--c-primary); color: #fff; }
.translate-section { padding-top: 12px; border-top: 1px solid var(--c-border); }
.translate-result {
  background: var(--c-bg); border: 1px solid var(--c-border);
  border-radius: var(--r-sm); padding: 12px;
  color: var(--c-primary); font-size: 14px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-all;
  min-height: 60px;
}
.translate-lang { font-size: 11px; color: var(--c-gray-500); margin-bottom: 6px; font-weight: 500; }
.result-actions { display: flex; gap: 6px; margin-top: 10px; }
.result-btn { flex: 1; padding: 8px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 500; transition: all 0.12s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.result-btn svg { width: 14px; height: 14px; }
.result-btn.copy { background: #222230; color: #aaa; }
.result-btn.copy:hover { background: #2a2b35; color: #fff; }
.result-btn.translate { background: #1a2a4a; color: #6eaaff; }
.result-btn.translate:hover { background: #223460; }

.translate-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #222230; }
.translate-result { background: #111218; border: 1px solid #2a2b35; border-radius: 6px; padding: 12px; color: #8ab4f8; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; min-height: 40px; }
.translate-lang { font-size: 11px; color: #555; margin-bottom: 6px; font-weight: 500; }
.panel-loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #444; font-size: 13px; gap: 8px; }
.spinner { width: 16px; height: 16px; border: 2px solid #333; border-top-color: #5b7fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="toolbar">
  <button class="tool-btn active" data-tool="pencil" data-tip="画笔 P">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
  </button>
  <button class="tool-btn" data-tool="rect" data-tip="矩形 R">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
  </button>
  <button class="tool-btn" data-tool="arrow" data-tip="箭头 A">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19L19 5M19 5v12M19 5H7"/></svg>
  </button>
  <button class="tool-btn" data-tool="text" data-tip="文字 T">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4h12M12 4v16M8 20h8"/></svg>
  </button>
  <button class="tool-btn" data-tool="blur" data-tip="马赛克 B">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1" opacity="0.5"/><rect x="9" y="2" width="5" height="5" rx="1" opacity="0.8"/><rect x="16" y="2" width="5" height="5" rx="1" opacity="0.3"/><rect x="2" y="9" width="5" height="5" rx="1" opacity="0.7"/><rect x="9" y="9" width="5" height="5" rx="1" opacity="0.4"/><rect x="16" y="9" width="5" height="5" rx="1" opacity="0.6"/><rect x="2" y="16" width="5" height="5" rx="1" opacity="0.4"/><rect x="9" y="16" width="5" height="5" rx="1" opacity="0.3"/><rect x="16" y="16" width="5" height="5" rx="1" opacity="0.8"/></svg>
  </button>
  <button class="tool-btn" data-tool="crop" data-tip="裁剪 C">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2v4H2M6 6h12v12M18 22v-4h4M18 18H6"/><path d="M6 6l12 12"/></svg>
  </button>
  <div class="tool-sep"></div>

  <button class="tool-btn" id="btnOCR" data-tip="提取文字">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
  </button>
  <button class="tool-btn" id="btnTranslate" data-tip="翻译">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M12 22l4-10 4 10M14.5 16h3"/></svg>
  </button>

  <div class="tool-sep"></div>

  <button class="tool-btn" id="btnUndo" data-tip="撤销 Ctrl+Z">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H8M3 10l4-4M3 10l4 4"/></svg>
  </button>

  <div class="tool-sep"></div>

  <div class="color-picker">
    <div class="color-dot active" style="background:#ff4444" data-color="#ff4444"></div>
    <div class="color-dot" style="background:#ffcc00" data-color="#ffcc00"></div>
    <div class="color-dot" style="background:#5b7fff" data-color="#5b7fff"></div>
    <div class="color-dot" style="background:#ffffff" data-color="#ffffff"></div>
    <div class="color-dot" style="background:#000000; border:1px solid #444" data-color="#000000"></div>
  </div>

  <div class="width-picker">
    <div class="width-dot active" data-width="2" style="width:6px;height:6px"></div>
    <div class="width-dot" data-width="4" style="width:9px;height:9px"></div>
    <div class="width-dot" data-width="8" style="width:13px;height:13px"></div>
  </div>

  <div class="font-size-picker" id="fontSizePicker">
    <span>字号</span>
    <input type="number" id="fontSizeInput" value="20" min="10" max="100">
  </div>

  <div class="toolbar-right">
    <button class="btn btn-cancel" id="btnCancel">取消</button>
    <button class="btn btn-copy" id="btnCopyToClipboard">复制到剪贴板</button>
    <button class="btn btn-save" id="btnSave">保存</button>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div class="bottom-bar">
  <div class="hint">
    <span><kbd>P</kbd> 画笔</span>
    <span><kbd>R</kbd> 矩形</span>
    <span><kbd>A</kbd> 箭头</span>
    <span><kbd>T</kbd> 文字</span>
    <span><kbd>B</kbd> 马赛克</span>
    <span><kbd>C</kbd> 裁剪</span>
    <span><kbd>S</kbd> 翻译</span>
    <span><kbd>Ctrl+Z</kbd> 撤销</span>
  </div>
  <span id="sizeInfo"></span>
</div>

<div class="text-input" id="textInput">
  <textarea id="textarea" rows="1" placeholder="输入文字，Enter 确认"></textarea>
</div>

<!-- 结果面板 -->
<div class="text-panel" id="textPanel">
  <div class="text-panel-header">
    <span class="text-panel-title" id="panelTitle">结果</span>
    <button class="text-panel-close" id="btnClosePanel">×</button>
  </div>
  <div class="text-panel-body">
    <div id="panelLoading" class="panel-loading" style="display:none">
      <div class="spinner"></div>
      <span id="loadingText">正在识别…</span>
    </div>
    <div id="panelContent" style="display:none">
      <div class="result-label" id="resultLabel">识别结果</div>
      <div class="result-text" id="resultText" tabindex="0"></div>
      <div class="result-actions">
        <button class="result-btn copy" id="btnCopyResult">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          复制
        </button>
        <button class="result-btn translate" id="btnDoTranslate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1"/></svg>
          翻译
        </button>
      </div>
      <div class="translate-section" id="translateSection" style="display:none">
        <div class="translate-lang" id="translateLang"></div>
        <div class="translate-result" id="translateResult"></div>
        <div class="result-actions" style="margin-top:10px">
          <button class="result-btn copy" id="btnCopyTranslated">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            复制译文
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron')

const canvas = document.getElementById('canvas')
const ctx = canvas.getContext('2d')
const textInput = document.getElementById('textInput')
const textarea = document.getElementById('textarea')
const sizeInfo = document.getElementById('sizeInfo')
const fontSizePicker = document.getElementById('fontSizePicker')
const fontSizeInput = document.getElementById('fontSizeInput')

// Panel elements
const textPanel = document.getElementById('textPanel')
const panelTitle = document.getElementById('panelTitle')
const panelLoading = document.getElementById('panelLoading')
const panelContent = document.getElementById('panelContent')
const resultLabel = document.getElementById('resultLabel')
const resultText = document.getElementById('resultText')
const translateSection = document.getElementById('translateSection')
const translateLang = document.getElementById('translateLang')
const translateResult = document.getElementById('translateResult')

let img = null
let imgPath = ''
let tool = 'pencil'
let color = '#ff4444'
let lineWidth = 2
let fontSize = 20
let drawing = false
let startX = 0, startY = 0
let actions = []
let pencilPoints = []
let ocrText = ''
let zoom = 1
let panX = 0, panY = 0
let isPanning = false
let panStartX = 0, panStartY = 0

// Load image
const params = new URLSearchParams(window.location.search)
imgPath = params.get('path') || ''
if (imgPath) {
  img = new Image()
  img.onload = () => {
    canvas.width = img.width
    canvas.height = img.height
    ctx.drawImage(img, 0, 0)
    sizeInfo.textContent = `${img.width} × ${img.height}`
    fitCanvasToView()
  }
  img.src = 'file:///' + imgPath.replace(/\\/g, '/')
}

// ---- Zoom & Pan ----
const canvasWrap = document.querySelector('.canvas-wrap')

function fitCanvasToView() {
  if (!img) return
  const wrapRect = canvasWrap.getBoundingClientRect()
  const displayW = wrapRect.width - 40
  const displayH = wrapRect.height - 40
  const scaleX = displayW / img.width
  const scaleY = displayH / img.height
  zoom = Math.min(scaleX, scaleY, 1)
  panX = 0
  panY = 0
  applyTransform()
  sizeInfo.textContent = `${img.width} × ${img.height}  ·  ${Math.round(zoom * 100)}%`
}

function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`
  canvas.style.transformOrigin = 'top left'
  sizeInfo.textContent = `${img.width} × ${img.height}  ·  ${Math.round(zoom * 100)}%`
}

canvasWrap.addEventListener('wheel', (e) => {
  e.preventDefault()
  const delta = e.deltaY > 0 ? -0.15 : 0.15
  const newZoom = Math.max(0.1, Math.min(10, zoom + delta))
  if (newZoom === zoom || !img) return
  zoom = newZoom
  applyTransform()
}, { passive: false })

canvasWrap.addEventListener('mousedown', (e) => {
  if (e.button === 1) {
    e.preventDefault()
    isPanning = true
    panStartX = e.clientX - panX
    panStartY = e.clientY - panY
    canvasWrap.style.cursor = 'grab'
  }
})
window.addEventListener('mousemove', (e) => {
  if (isPanning) { panX = e.clientX - panStartX; panY = e.clientY - panStartY; applyTransform() }
})
window.addEventListener('mouseup', (e) => {
  if (e.button === 1) { isPanning = false; canvasWrap.style.cursor = '' }
})
canvasWrap.addEventListener('dblclick', () => {
  if (img) fitCanvasToView()
})

// ---- Tool selection ----
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.tool-btn.active')?.classList.remove('active')
    btn.classList.add('active')
    tool = btn.dataset.tool
    canvas.style.cursor = tool === 'text' ? 'text' : 'crosshair'
    fontSizePicker.classList.toggle('show', tool === 'text')
    hideTextInput()
    // 恢复画布，去掉残留的选区框
    if (actions.length > 0) {
      ctx.putImageData(actions[actions.length - 1], 0, 0)
    }
  })
})

// Colors
document.querySelectorAll('.color-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelector('.color-dot.active')?.classList.remove('active')
    dot.classList.add('active')
    color = dot.dataset.color
  })
})

// Width
document.querySelectorAll('.width-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.querySelector('.width-dot.active')?.classList.remove('active')
    dot.classList.add('active')
    lineWidth = parseInt(dot.dataset.width)
  })
})

fontSizeInput.addEventListener('change', () => { fontSize = parseInt(fontSizeInput.value) || 20 })
document.getElementById('btnUndo').addEventListener('click', undo)

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target === textarea || e.target === fontSizeInput) { if (e.key === 'Escape') hideTextInput(); return }
  // 修饰键优先（Ctrl+S 等必须在单键之前）
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); return }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); save(); return }
  if (e.ctrlKey) return // 其他 Ctrl 组合不处理
  // 单键快捷键
  if (e.key === 'p') selectTool('pencil')
  else if (e.key === 'r') selectTool('rect')
  else if (e.key === 'a') selectTool('arrow')
  else if (e.key === 't') selectTool('text')
  else if (e.key === 'b') selectTool('blur')
  else if (e.key === 'c') selectTool('crop')
  else if (e.key === 's') selectTool('translate')
  else if (e.key === 'Escape') {
    if (textPanel.classList.contains('show')) textPanel.classList.remove('show')
    else ipcRenderer.send('editor:cancel')
  }
})

function selectTool(t) { document.querySelector(`.tool-btn[data-tool="${t}"]`)?.click() }

// ---- Canvas events ----
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect()
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height
  startX = (e.clientX - rect.left) * sx
  startY = (e.clientY - rect.top) * sy
  if (tool === 'text') { showTextInput(e.clientX, e.clientY, startX, startY); return }
  drawing = true
  actions.push(ctx.getImageData(0, 0, canvas.width, canvas.height))
  if (tool === 'pencil') { pencilPoints = [{ x: startX, y: startY }]; ctx.beginPath(); ctx.moveTo(startX, startY); ctx.strokeStyle = color; ctx.lineWidth = lineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round' }
})

canvas.addEventListener('mousemove', (e) => {
  if (!drawing) return
  const rect = canvas.getBoundingClientRect()
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height
  const curX = (e.clientX - rect.left) * sx, curY = (e.clientY - rect.top) * sy
  if (tool === 'pencil') { ctx.lineTo(curX, curY); ctx.stroke(); pencilPoints.push({ x: curX, y: curY }) }
  else {
    if (actions.length) ctx.putImageData(actions[actions.length - 1], 0, 0)
    if (tool === 'rect') drawRect(startX, startY, curX, curY)
    else if (tool === 'arrow') drawArrow(startX, startY, curX, curY)
    else if (tool === 'blur') drawBlur(startX, startY, curX, curY)
    else if (tool === 'crop' || tool === 'translate') drawCropRect(startX, startY, curX, curY)
  }
})

canvas.addEventListener('mouseup', (e) => {
  if (!drawing) return
  drawing = false
  const rect = canvas.getBoundingClientRect()
  const sx = canvas.width / rect.width, sy = canvas.height / rect.height
  const endX = (e.clientX - rect.left) * sx, endY = (e.clientY - rect.top) * sy
  if (tool === 'pencil') { ctx.putImageData(actions[actions.length - 1], 0, 0); drawSmoothLine(pencilPoints) }
  else if (tool === 'crop') doCrop(startX, startY, endX, endY)
  else if (tool === 'translate') doTranslate(startX, startY, endX, endY)
})

// ---- Drawing ----
function drawSmoothLine(points) {
  if (points.length < 2) return
  ctx.strokeStyle = color; ctx.lineWidth = lineWidth; ctx.lineCap = 'round'; ctx.lineJoin = 'round'
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y)
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i].x + points[i + 1].x) / 2, my = (points[i].y + points[i + 1].y) / 2
    ctx.quadraticCurveTo(points[i].x, points[i].y, mx, my)
  }
  ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y)
  ctx.stroke()
}

function drawRect(x1, y1, x2, y2) { ctx.strokeStyle = color; ctx.lineWidth = lineWidth; ctx.lineJoin = 'round'; ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1)) }

function drawArrow(x1, y1, x2, y2) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth; ctx.lineCap = 'round'
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke()
  const angle = Math.atan2(y2 - y1, x2 - x1), headLen = 10 + lineWidth * 4
  ctx.beginPath(); ctx.moveTo(x2, y2)
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.35), y2 - headLen * Math.sin(angle - 0.35))
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.35), y2 - headLen * Math.sin(angle + 0.35))
  ctx.closePath(); ctx.fill()
}

function drawBlur(x1, y1, x2, y2) {
  const bx = Math.floor(Math.min(x1, x2)), by = Math.floor(Math.min(y1, y2))
  const bw = Math.floor(Math.abs(x2 - x1)), bh = Math.floor(Math.abs(y2 - y1))
  if (bw < 4 || bh < 4) return
  const pixelSize = 12, imgData = ctx.getImageData(bx, by, bw, bh), d = imgData.data
  for (let y = 0; y < bh; y += pixelSize) {
    for (let x = 0; x < bw; x += pixelSize) {
      const i = (y * bw + x) * 4, r = d[i], g = d[i+1], b = d[i+2]
      for (let dy = 0; dy < pixelSize && y+dy < bh; dy++)
        for (let dx = 0; dx < pixelSize && x+dx < bw; dx++) {
          const j = ((y+dy) * bw + (x+dx)) * 4; d[j] = r; d[j+1] = g; d[j+2] = b
        }
    }
  }
  ctx.putImageData(imgData, bx, by)
}

function drawCropRect(x1, y1, x2, y2) {
  const rx = Math.min(x1, x2), ry = Math.min(y1, y2), rw = Math.abs(x2 - x1), rh = Math.abs(y2 - y1)
  ctx.fillStyle = 'rgba(0,0,0,0.5)'
  ctx.fillRect(0, 0, canvas.width, ry); ctx.fillRect(0, ry, rx, rh)
  ctx.fillRect(rx + rw, ry, canvas.width - rx - rw, rh); ctx.fillRect(0, ry + rh, canvas.width, canvas.height - ry - rh)
  ctx.strokeStyle = '#5b7fff'; ctx.lineWidth = 2; ctx.setLineDash([6, 4])
  ctx.strokeRect(rx, ry, rw, rh); ctx.setLineDash([])
  ctx.fillStyle = '#5b7fff'; ctx.font = '12px sans-serif'
  ctx.fillText(`${Math.round(rw)} × ${Math.round(rh)}`, rx + 4, ry - 6)
}

function doCrop(x1, y1, x2, y2) {
  const cx = Math.floor(Math.min(x1, x2)), cy = Math.floor(Math.min(y1, y2))
  const cw = Math.floor(Math.abs(x2 - x1)), ch = Math.floor(Math.abs(y2 - y1))
  if (cw < 10 || ch < 10) return
  const cropped = ctx.getImageData(cx, cy, cw, ch)
  canvas.width = cw; canvas.height = ch; ctx.putImageData(cropped, 0, 0)
  actions = []; sizeInfo.textContent = `${cw} × ${ch}`
}

// ---- Text ----
function showTextInput(sx, sy, cx, cy) {
  textInput.style.display = 'block'; textInput.style.left = sx + 'px'; textInput.style.top = sy + 'px'
  textarea.value = ''; textarea.style.color = color; textarea.style.fontSize = fontSize + 'px'; textarea.focus()
  textarea.onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      const text = textarea.value.trim()
      if (text) {
        actions.push(ctx.getImageData(0, 0, canvas.width, canvas.height))
        ctx.fillStyle = color; ctx.font = `${fontSize}px 'Inter','PingFang SC','Microsoft YaHei',sans-serif`
        text.split('\n').forEach((line, i) => ctx.fillText(line, cx, cy + (i + 1) * (fontSize + 4)))
      }
      hideTextInput()
    }
    if (e.key === 'Escape') hideTextInput()
  }
}
function hideTextInput() { textInput.style.display = 'none'; textarea.value = '' }
function undo() { if (actions.length > 0) ctx.putImageData(actions.pop(), 0, 0) }

// 自动调整 textarea 高度
function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = el.scrollHeight + 'px'
}
function save() { ipcRenderer.send('editor:save', { path: imgPath, data: canvas.toDataURL('image/png') }) }

function copyToClipboard() {
  canvas.toBlob((blob) => {
    const item = new ClipboardItem({ 'image/png': blob })
    navigator.clipboard.write([item]).then(() => {
      const btn = document.getElementById('btnCopyToClipboard')
      btn.textContent = '已复制 ✓'
      btn.style.background = 'var(--c-primary)'
      btn.style.color = '#fff'
      setTimeout(() => {
        btn.textContent = '复制到剪贴板'
        btn.style.background = ''
        btn.style.color = ''
      }, 1500)
    })
  }, 'image/png')
}

document.getElementById('btnCopyToClipboard').addEventListener('click', copyToClipboard)

// ---- Panel helpers ----
function showPanel(title, label) {
  panelTitle.textContent = title || '结果'
  resultLabel.textContent = label || '识别结果'
  panelLoading.style.display = 'none'
  panelContent.style.display = 'block'
  translateSection.style.display = 'none'
  textPanel.classList.add('show')
}
function showPanelLoading(msg) {
  textPanel.classList.add('show')
  panelContent.style.display = 'none'
  panelLoading.style.display = 'flex'
  document.getElementById('loadingText').textContent = msg || '正在识别…'
}
function hidePanel() { textPanel.classList.remove('show') }

// ---- OCR (full image) ----
async function doOCRFullImage() {
  if (!img) return
  // 先撤销所有绘制，只保留原图
  const tmp = document.createElement('canvas')
  tmp.width = img.width; tmp.height = img.height
  tmp.getContext('2d').drawImage(img, 0, 0)
  const dataUrl = tmp.toDataURL('image/png')

  showPanelLoading('正在提取文字…')
  try {
    const text = await ipcRenderer.invoke('ocr:recognize', dataUrl)
    ocrText = text || ''
    resultText.textContent = ocrText || '未识别到文字'
    showPanel('提取文字', '识别结果')
    document.getElementById('btnDoTranslate').style.display = ocrText ? 'flex' : 'none'
  } catch { resultText.textContent = '识别失败'; showPanel('提取文字', '识别结果') }
}

// ---- 翻译 (full image) ----
async function doTranslateFullImage() {
  if (!img) return
  // 先做 OCR
  const tmp = document.createElement('canvas')
  tmp.width = img.width; tmp.height = img.height
  tmp.getContext('2d').drawImage(img, 0, 0)
  const dataUrl = tmp.toDataURL('image/png')

  showPanelLoading('正在识别并翻译…')
  try {
    const text = await ipcRenderer.invoke('ocr:recognize', dataUrl)
    ocrText = text || ''
    resultText.textContent = ocrText || '未识别到文字'

    if (ocrText) {
      translateSection.style.display = 'block'
      translateResult.textContent = '正在翻译…'
      const hasChinese = /[一-龥]/.test(ocrText)
      const result = await ipcRenderer.invoke('translate:text', ocrText, hasChinese ? 'zh' : 'en', hasChinese ? 'en' : 'zh')
      translateLang.textContent = hasChinese ? 'English' : '中文'
      translateResult.textContent = result || '翻译失败'
    autoResize(translateResult)
    }
    showPanel('翻译结果', '原文')
    document.getElementById('btnDoTranslate').style.display = ocrText ? 'flex' : 'none'
  } catch { resultText.textContent = '识别失败'; showPanel('翻译结果', '识别结果') }
}

document.getElementById('btnOCR').addEventListener('click', doOCRFullImage)
document.getElementById('btnTranslate').addEventListener('click', doTranslateFullImage)

// ---- Panel buttons ----
document.getElementById('btnClosePanel').addEventListener('click', hidePanel)

document.getElementById('btnCopyResult').addEventListener('click', async () => {
  const text = resultText.textContent
  if (text) {
    await ipcRenderer.invoke('items:copy', { type: 'text', content: text })
    const btn = document.getElementById('btnCopyResult')
    btn.textContent = '已复制 ✓'
    setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制' }, 1200)
  }
})

document.getElementById('btnDoTranslate').addEventListener('click', async () => {
  if (!ocrText) return
  translateSection.style.display = 'block'
  translateResult.textContent = '正在翻译…'
  translateLang.textContent = ''
  try {
    const hasChinese = /[一-龥]/.test(ocrText)
    const result = await ipcRenderer.invoke('translate:text', ocrText, hasChinese ? 'zh' : 'en', hasChinese ? 'en' : 'zh')
    translateLang.textContent = hasChinese ? 'English' : '中文'
    translateResult.textContent = result || '翻译失败'
    autoResize(translateResult)
  } catch { translateResult.textContent = '翻译失败' }
})

document.getElementById('btnCopyTranslated').addEventListener('click', async () => {
  const text = translateResult.textContent
  if (text && text !== '正在翻译…') {
    await ipcRenderer.invoke('items:copy', { type: 'text', content: text })
    const btn = document.getElementById('btnCopyTranslated')
    btn.textContent = '已复制 ✓'
    setTimeout(() => { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制译文' }, 1200)
  }
})

// ---- 框选翻译 ----
async function doTranslate(x1, y1, x2, y2) {
  const cx = Math.floor(Math.min(x1, x2)), cy = Math.floor(Math.min(y1, y2))
  const cw = Math.floor(Math.abs(x2 - x1)), ch = Math.floor(Math.abs(y2 - y1))
  if (cw < 10 || ch < 10) return

  // 裁剪选区
  const tmp = document.createElement('canvas')
  tmp.width = cw; tmp.height = ch
  tmp.getContext('2d').drawImage(canvas, cx, cy, cw, ch, 0, 0, cw, ch)
  const dataUrl = tmp.toDataURL('image/png')

  showPanelLoading('正在识别…')

  try {
    const text = await ipcRenderer.invoke('ocr:recognize', dataUrl)
    ocrText = text || ''
    resultText.textContent = ocrText || '未识别到文字'
    showPanel('翻译结果', '原文')
    document.getElementById('btnDoTranslate').style.display = ocrText ? 'flex' : 'none'

    // 自动翻译
    if (ocrText) {
      translateSection.style.display = 'block'
      translateResult.textContent = '正在翻译…'
      const hasChinese = /[一-龥]/.test(ocrText)
      const result = await ipcRenderer.invoke('translate:text', ocrText, hasChinese ? 'zh' : 'en', hasChinese ? 'en' : 'zh')
      translateLang.textContent = hasChinese ? 'English' : '中文'
      translateResult.textContent = result || '翻译失败'
    autoResize(translateResult)
    }
  } catch {
    resultText.textContent = '识别失败'
    showPanel('翻译结果', '原文')
  }
}

// 取消按钮
document.getElementById('btnCancel').addEventListener('click', () => {
  ipcRenderer.send('editor:cancel')
})
