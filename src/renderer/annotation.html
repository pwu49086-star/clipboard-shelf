<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,.6);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}

/* 画布区域 */
.canvas-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 9999px rgba(0,0,0,.6)}
canvas{display:block;cursor:crosshair}

/* 主工具栏 - 底部居中 */
.toolbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:rgba(30,30,30,.92);border-radius:12px;padding:6px 8px;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:100}
.tool-btn{width:36px;height:36px;border:none;border-radius:8px;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s ease;position:relative}
.tool-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.tool-btn.active{background:rgba(59,130,246,.85);color:#fff}
.tool-btn svg{width:18px;height:18px}
.tool-btn .shortcut{position:absolute;bottom:2px;right:4px;font-size:8px;opacity:.5}
.divider{width:1px;height:24px;background:rgba(255,255,255,.15);margin:0 4px}

/* 颜色选择器 - 工具栏右侧 */
.color-picker{display:flex;align-items:center;gap:6px;margin-left:4px}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s;position:relative}
.color-dot:hover{transform:scale(1.15)}
.color-dot.active{border-color:#fff;box-shadow:0 0 0 2px rgba(59,130,246,.8)}
.color-dot .check{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;opacity:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.color-dot.active .check{opacity:1}

/* 线宽选择 */
.width-picker{display:flex;align-items:center;gap:4px;margin-left:4px}
.width-dot{border-radius:50%;background:rgba(255,255,255,.7);cursor:pointer;transition:all .12s}
.width-dot:hover{background:#fff}
.width-dot.active{background:#3b82f6}

/* 操作按钮 - 右下角 */
.actions{position:fixed;bottom:24px;right:24px;display:flex;gap:8px;z-index:100}
.action-btn{padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;display:flex;align-items:center;gap:6px}
.action-btn.cancel{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);backdrop-filter:blur(10px)}
.action-btn.cancel:hover{background:rgba(255,255,255,.2)}
.action-btn.undo{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);backdrop-filter:blur(10px);padding:8px 12px}
.action-btn.undo:hover{background:rgba(255,255,255,.2)}
.action-btn.redo{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);backdrop-filter:blur(10px);padding:8px 12px}
.action-btn.redo:hover{background:rgba(255,255,255,.2)}
.action-btn.save{background:rgba(59,130,246,.9);color:#fff;backdrop-filter:blur(10px)}
.action-btn.save:hover{background:rgba(59,130,246,1)}

/* 提示文字 */
.hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12px;z-index:100;pointer-events:none}

/* 文字输入 */
.text-input{position:absolute;z-index:50;min-width:100px;min-height:30px;background:transparent;border:1px dashed rgba(59,130,246,.6);outline:none;color:currentColor;font-size:16px;padding:4px 8px;resize:both;font-family:inherit}
</style>
</head>
<body>
<div class="hint">按住拖拽绘制 · Shift 水平/垂直 · Ctrl+Z 撤销 · Ctrl+S 保存 · Esc 取消</div>
<div class="canvas-wrap" id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>

<!-- 工具栏 -->
<div class="toolbar" id="toolbar">
  <button class="tool-btn active" data-tool="rect" title="矩形 (R)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
  </button>
  <button class="tool-btn" data-tool="ellipse" title="椭圆 (O)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
  </button>
  <button class="tool-btn" data-tool="arrow" title="箭头 (A)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
  <button class="tool-btn" data-tool="line" title="直线 (L)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
  </button>
  <button class="tool-btn" data-tool="pen" title="画笔 (P)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
  </button>
  <div class="divider"></div>
  <button class="tool-btn" data-tool="text" title="文字 (T)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9.5" y1="20" x2="14.5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
  </button>
  <button class="tool-btn" data-tool="highlight" title="高亮 (H)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 01-2.8 0l-5.2-5.2a2 2 0 010-2.8L14 4"/></svg>
  </button>
  <button class="tool-btn" data-tool="mosaic" title="马赛克 (M)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  </button>
  <button class="tool-btn" data-tool="number" title="序号 (N)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" fill="currentColor" stroke="none" font-size="12" font-weight="bold">1</text></svg>
  </button>
  <div class="divider"></div>
  <!-- 颜色 -->
  <div class="color-picker" id="colorPicker">
    <div class="color-dot active" data-color="#ef4444" style="background:#ef4444"><span class="check">✓</span></div>
    <div class="color-dot" data-color="#f97316" style="background:#f97316"><span class="check">✓</span></div>
    <div class="color-dot" data-color="#eab308" style="background:#eab308"><span class="check">✓</span></div>
    <div class="color-dot" data-color="#22c55e" style="background:#22c55e"><span class="check">✓</span></div>
    <div class="color-dot" data-color="#3b82f6" style="background:#3b82f6"><span class="check">✓</span></div>
    <div class="color-dot" data-color="#a855f7" style="background:#a855f7"><span class="check">✓</span></div>
    <div class="color-dot" data-color="#ffffff" style="background:#ffffff"><span class="check" style="color:#333">✓</span></div>
    <div class="color-dot" data-color="#000000" style="background:#000000;border:1px solid rgba(255,255,255,.3)"><span class="check">✓</span></div>
  </div>
  <div class="divider"></div>
  <!-- 线宽 -->
  <div class="width-picker" id="widthPicker">
    <div class="width-dot" data-width="2" style="width:8px;height:8px"></div>
    <div class="width-dot active" data-width="3" style="width:10px;height:10px"></div>
    <div class="width-dot" data-width="5" style="width:12px;height:12px"></div>
    <div class="width-dot" data-width="8" style="width:14px;height:14px"></div>
  </div>
</div>

<!-- 操作按钮 -->
<div class="actions">
  <button class="action-btn undo" id="undoBtn" title="Ctrl+Z">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
  </button>
  <button class="action-btn redo" id="redoBtn" title="Ctrl+Y">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.13-9.36L23 10"/></svg>
  </button>
  <button class="action-btn cancel" id="cancelBtn">取消</button>
  <button class="action-btn save" id="saveBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    保存
  </button>
</div>

<script>
const{ipcRenderer}=require('electron')
const canvas=document.getElementById('canvas')
const ctx=canvas.getContext('2d')
const canvasWrap=document.getElementById('canvasWrap')

// ====== State ======
let currentTool='rect'
let currentColor='#ef4444'
let lineWidth=3
let isDrawing=false
let startX,startY,lastX,lastY
let snapshotBeforeShape
let history=[]
let historyIndex=-1
let numberCounter=1
let shiftKey=false

// 图片
let bgImg=null
let imgW=0,imgH=0

// ====== Init ======
ipcRenderer.on('annotation:init',(e,data)=>{
  imgW=data.width
  imgH=data.height
  
  // 设置画布大小
  canvas.width=imgW
  canvas.height=imgH
  canvasWrap.style.width=imgW+'px'
  canvasWrap.style.height=imgH+'px'
  
  // 加载背景图
  bgImg=new Image()
  bgImg.onload=()=>{
    ctx.drawImage(bgImg,0,0,imgW,imgH)
    saveState()
  }
  bgImg.src='file:///'+data.imagePath.replace(/\\/g,'/')
})

// ====== History ======
function saveState(){
  // 清除 redo 历史
  history=history.slice(0,historyIndex+1)
  history.push(canvas.toDataURL())
  historyIndex=history.length-1
  // 限制历史长度
  if(history.length>50){history.shift();historyIndex--}
}
function undo(){
  if(historyIndex<=0)return
  historyIndex--
  restoreState(history[historyIndex])
}
function redo(){
  if(historyIndex>=history.length-1)return
  historyIndex++
  restoreState(history[historyIndex])
}
function restoreState(dataUrl){
  const img=new Image()
  img.onload=()=>{ctx.clearRect(0,0,imgW,imgH);ctx.drawImage(img,0,0)}
  img.src=dataUrl
}

// ====== Tools ======
document.querySelectorAll('.tool-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelector('.tool-btn.active')?.classList.remove('active')
    btn.classList.add('active')
    currentTool=btn.dataset.tool
    canvas.style.cursor=currentTool==='text'?'text':'crosshair'
    // 文字工具取消序号计数
    if(currentTool!=='number')numberCounter=1
  })
})

// 颜色
document.querySelectorAll('.color-dot').forEach(dot=>{
  dot.addEventListener('click',()=>{
    document.querySelector('.color-dot.active')?.classList.remove('active')
    dot.classList.add('active')
    currentColor=dot.dataset.color
  })
})

// 线宽
document.querySelectorAll('.width-dot').forEach(dot=>{
  dot.addEventListener('click',()=>{
    document.querySelector('.width-dot.active')?.classList.remove('active')
    dot.classList.add('active')
    lineWidth=parseInt(dot.dataset.width)
  })
})

// ====== Keyboard ======
document.addEventListener('keydown',(e)=>{
  if(e.key==='Shift')shiftKey=true
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo()}
  if(e.ctrlKey&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo()}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();save()}
  if(e.key==='Escape')ipcRenderer.send('annotation:cancel')
  // 工具快捷键
  if(!e.ctrlKey&&!e.altKey){
    const map={r:'rect',o:'ellipse',a:'arrow',l:'line',p:'pen',t:'text',h:'highlight',m:'mosaic',n:'number'}
    if(map[e.key]){
      const btn=document.querySelector(`[data-tool="${map[e.key]}"]`)
      if(btn)btn.click()
    }
  }
})
document.addEventListener('keyup',(e)=>{if(e.key==='Shift')shiftKey=false})

// ====== Drawing ======
function getPos(e){
  const r=canvas.getBoundingClientRect()
  return{x:e.clientX-r.left,y:e.clientY-r.top}
}

canvas.addEventListener('mousedown',(e)=>{
  if(e.button!==0)return
  const pos=getPos(e)
  isDrawing=true
  startX=pos.x;startY=pos.y
  lastX=pos.x;lastY=pos.y

  if(currentTool==='pen'){
    ctx.beginPath()
    ctx.moveTo(pos.x,pos.y)
    ctx.strokeStyle=currentColor
    ctx.lineWidth=lineWidth
    ctx.lineCap='round'
    ctx.lineJoin='round'
    ctx.globalAlpha=1
  }else if(currentTool==='text'){
    isDrawing=false
    createTextInput(pos.x,pos.y)
  }else if(currentTool==='number'){
    isDrawing=false
    drawNumber(pos.x,pos.y)
    saveState()
  }else if(currentTool==='highlight'){
    snapshotBeforeShape=canvas.toDataURL()
    ctx.globalAlpha=0.3
  }else if(currentTool==='mosaic'){
    snapshotBeforeShape=canvas.toDataURL()
  }else{
    snapshotBeforeShape=canvas.toDataURL()
  }
})

canvas.addEventListener('mousemove',(e)=>{
  if(!isDrawing)return
  const pos=getPos(e)
  
  // Shift 约束
  let dx=pos.x-startX,dy=pos.y-startY
  if(shiftKey){
    if(currentTool==='line'||currentTool==='arrow'){
      const angle=Math.atan2(dy,dx)
      const snap=Math.round(angle/(Math.PI/4))*(Math.PI/4)
      const dist=Math.sqrt(dx*dx+dy*dy)
      dx=dist*Math.cos(snap)
      dy=dist*Math.sin(snap)
      pos.x=startX+dx;pos.y=startY+dy
    }else{
      const size=Math.max(Math.abs(dx),Math.abs(dy))
      dx=dx<0?-size:size
      dy=dy<0?-size:size
      pos.x=startX+dx;pos.y=startY+dy
    }
  }

  if(currentTool==='pen'){
    ctx.lineTo(pos.x,pos.y)
    ctx.stroke()
  }else if(currentTool==='highlight'||currentTool==='mosaic'){
    // 实时预览
    const img=new Image()
    img.onload=()=>{
      ctx.clearRect(0,0,imgW,imgH)
      ctx.drawImage(img,0,0)
      drawShape(pos.x,pos.y)
    }
    img.src=snapshotBeforeShape
  }else{
    // 形状预览
    const img=new Image()
    img.onload=()=>{
      ctx.clearRect(0,0,imgW,imgH)
      ctx.drawImage(img,0,0)
      drawShape(pos.x,pos.y)
    }
    img.src=snapshotBeforeShape
  }
  lastX=pos.x;lastY=pos.y
})

canvas.addEventListener('mouseup',(e)=>{
  if(!isDrawing)return
  isDrawing=false
  const pos=getPos(e)
  
  if(currentTool==='pen'){
    ctx.closePath()
    ctx.globalAlpha=1
  }else{
    drawShape(pos.x,pos.y)
    ctx.globalAlpha=1
  }
  saveState()
})

// ====== Shape Drawing ======
function drawShape(endX,endY){
  ctx.strokeStyle=currentColor
  ctx.fillStyle=currentColor
  ctx.lineWidth=lineWidth
  ctx.lineCap='round'
  ctx.lineJoin='round'

  const dx=endX-startX,dy=endY-startY

  switch(currentTool){
    case'rect':
      ctx.strokeRect(startX,startY,dx,dy)
      break
    case'ellipse':
      ctx.beginPath()
      const rx=Math.abs(dx)/2,ry=Math.abs(dy)/2
      ctx.ellipse(startX+dx/2,startY+dy/2,rx,ry,0,0,Math.PI*2)
      ctx.stroke()
      break
    case'arrow':
      drawArrow(startX,startY,endX,endY)
      break
    case'line':
      ctx.beginPath()
      ctx.moveTo(startX,startY)
      ctx.lineTo(endX,endY)
      ctx.stroke()
      break
    case'highlight':
      ctx.fillStyle=currentColor
      ctx.globalAlpha=0.3
      ctx.fillRect(startX,startY,dx,dy)
      ctx.globalAlpha=1
      break
    case'mosaic':
      drawMosaic(startX,startY,endX,endY)
      break
  }
}

function drawArrow(x1,y1,x2,y2){
  const headLen=12+lineWidth*2
  const angle=Math.atan2(y2-y1,x2-x1)
  
  ctx.beginPath()
  ctx.moveTo(x1,y1)
  ctx.lineTo(x2,y2)
  ctx.stroke()
  
  // 箭头头部
  ctx.beginPath()
  ctx.moveTo(x2,y2)
  ctx.lineTo(x2-headLen*Math.cos(angle-Math.PI/7),y2-headLen*Math.sin(angle-Math.PI/7))
  ctx.lineTo(x2-headLen*Math.cos(angle+Math.PI/7),y2-headLen*Math.sin(angle+Math.PI/7))
  ctx.closePath()
  ctx.fill()
}

function drawMosaic(x1,y1,x2,y2){
  const size=Math.max(8,lineWidth*3)
  const minX=Math.min(x1,x2),maxX=Math.max(x1,x2)
  const minY=Math.min(y1,y2),maxY=Math.max(y1,y2)
  
  // 获取原图数据
  const imgData=bgImg?null:ctx.getImageData(0,0,imgW,imgH)
  
  for(let x=minX;x<maxX;x+=size){
    for(let y=minY;y<maxY;y+=size){
      const w=Math.min(size,maxX-x)
      const h=Math.min(size,maxY-y)
      const pixel=ctx.getImageData(x,y,1,1).data
      ctx.fillStyle=`rgb(${pixel[0]},${pixel[1]},${pixel[2]})`
      ctx.fillRect(x,y,w,h)
    }
  }
}

// ====== Text ======
function createTextInput(x,y){
  const input=document.createElement('textarea')
  input.className='text-input'
  input.style.left=(canvasWrap.offsetLeft+x)+'px'
  input.style.top=(canvasWrap.offsetTop+y)+'px'
  input.style.color=currentColor
  input.style.fontSize=Math.max(14,lineWidth*4)+'px'
  document.body.appendChild(input)
  input.focus()
  
  const commit=()=>{
    const text=input.value.trim()
    if(text){
      ctx.font=`bold ${Math.max(14,lineWidth*4)}px -apple-system,sans-serif`
      ctx.fillStyle=currentColor
      ctx.textBaseline='top'
      // 多行支持
      const lines=text.split('\n')
      const lineH=Math.max(14,lineWidth*4)*1.3
      lines.forEach((line,i)=>{
        ctx.fillText(line,x+4,y+4+i*lineH)
      })
      saveState()
    }
    input.remove()
  }
  
  input.addEventListener('blur',commit)
  input.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){input.value='';input.blur()}
    if(e.key==='Enter'&&e.ctrlKey)commit()
  })
}

// ====== Number ======
function drawNumber(x,y){
  const r=14
  ctx.beginPath()
  ctx.arc(x,y,r,0,Math.PI*2)
  ctx.fillStyle=currentColor
  ctx.fill()
  
  ctx.font='bold 14px -apple-system,sans-serif'
  ctx.fillStyle='#fff'
  ctx.textAlign='center'
  ctx.textBaseline='middle'
  ctx.fillText(String(numberCounter),x,y+1)
  
  numberCounter++
  ctx.textAlign='start'
}

// ====== Save/Cancel ======
function save(){
  canvas.toBlob(blob=>{
    const reader=new FileReader()
    reader.onload=()=>{
      const base64=reader.result.split(',')[1]
      ipcRenderer.send('annotation:save',{base64})
    }
    reader.readAsDataURL(blob)
  },'image/png')
}

document.getElementById('saveBtn').addEventListener('click',save)
document.getElementById('cancelBtn').addEventListener('click',()=>ipcRenderer.send('annotation:cancel'))
document.getElementById('undoBtn').addEventListener('click',undo)
document.getElementById('redoBtn').addEventListener('click',redo)
</script>
</body>
</html>
