<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }
    #mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
    }
    #selection {
      position: fixed;
      border: 2px solid #31c27c;
      background: transparent;
      display: none;
      pointer-events: none;
    }
    #size-tip {
      position: fixed;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 3px;
      display: none;
      pointer-events: none;
      font-family: -apple-system, sans-serif;
    }
    #hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-family: -apple-system, 'Microsoft YaHei', sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="mask"></div>
  <div id="selection"></div>
  <div id="size-tip"></div>
  <div id="hint">拖动鼠标选择截图区域 · 按 Esc 取消</div>

  <script>
    let startX = 0, startY = 0
    let selecting = false
    const selection = document.getElementById('selection')
    const sizeTip = document.getElementById('size-tip')
    const hint = document.getElementById('hint')

    // 使用 clientX/clientY（CSS 像素）绘制选区，避免 DPI 缩放问题
    document.addEventListener('mousedown', (e) => {
      selecting = true
      startX = e.clientX
      startY = e.clientY
      selection.style.display = 'block'
      sizeTip.style.display = 'block'
      hint.style.display = 'none'
      updateSelection(e.clientX, e.clientY)
    })

    document.addEventListener('mousemove', (e) => {
      if (!selecting) return
      updateSelection(e.clientX, e.clientY)
    })

    document.addEventListener('mouseup', (e) => {
      if (!selecting) return
      selecting = false
      selection.style.display = 'none'
      sizeTip.style.display = 'none'

      // CSS 像素坐标，主进程会乘以 scaleFactor 转换为物理像素
      const x = Math.min(startX, e.clientX)
      const y = Math.min(startY, e.clientY)
      const w = Math.abs(e.clientX - startX)
      const h = Math.abs(e.clientY - startY)

      if (w > 10 && h > 10) {
        window.api.screenshotCapture({ x, y, width: w, height: h })
      } else {
        window.api.screenshotCancel()
      }
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.api.screenshotCancel()
      }
    })

    function updateSelection(cx, cy) {
      const x = Math.min(startX, cx)
      const y = Math.min(startY, cy)
      const w = Math.abs(cx - startX)
      const h = Math.abs(cy - startY)
      selection.style.left = x + 'px'
      selection.style.top = y + 'px'
      selection.style.width = w + 'px'
      selection.style.height = h + 'px'
      sizeTip.textContent = w + ' × ' + h
      sizeTip.style.left = (x + w + 8) + 'px'
      sizeTip.style.top = (y + h + 8) + 'px'
    }
  </script>
</body>
</html>
